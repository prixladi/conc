[package]
name = "conca"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "fs"] }
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "1.0.69"
rusqlite = { version = "0.43.0", features = ["bundled"] }
sha2 = "0.11.1"
hex = "0.4.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# local crates
daemon-client.workspace = true
project-settings.workspace = true
app-config.workspace = true
